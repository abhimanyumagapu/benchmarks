[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stead-bench"
version = "0.1.0"
description = "STEAD-Bench: a benchmark for functional RTL debug"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    # Rust core of Surfer's wellen: reads VCD and FST directly. Same engine as walker.
    "pywellen==0.25.6",
    # One call for any provider, with per-call USD cost. 1.80+ breaks on Python 3.10.
    "litellm<1.80",
    "tenacity",  # litellm's num_retries imports it but does not declare it
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
stead = "stead.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stead*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C901",
    "SIM", "RET", "PTH", "ARG", "ERA", "T20", "G", "TID", "PIE", "PERF",
    "PLR0912", "PLR0913", "PLR0915", "PLW",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"stead/__main__.py" = ["T201"]   # the CLI prints its result
"repos/**/*.py" = ["T201", "E501"]  # joiners print the one-line STEAD format; that is their output

[tool.ruff.format]
docstring-code-format = true
