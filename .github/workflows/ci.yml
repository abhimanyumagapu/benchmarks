# Lint and the harness tests. The tests need docker (the fake core runs in a real container);
# GitHub's ubuntu runners ship it. Core images are not built here: they need the prebuilt
# toolchain and take up to 40 min per core.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync --frozen --extra dev      # the locked versions, exactly
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: docker version
      # GitHub's runners forbid unprivileged user namespaces, so the agent sandbox degrades to a
      # passthrough here. That is the case this asserts: the probe must say so rather than hand
      # the agent a wrapper that fails and swallows every command it runs.
      - run: uv run python -c "from stead.agents import sandbox_kind; print(sandbox_kind())"
      - run: uv run python -m pytest -q
