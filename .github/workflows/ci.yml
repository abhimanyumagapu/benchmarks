# Lint and the harness tests. The tests need docker (the fake core runs in a real container);
# GitHub's ubuntu runners ship it. Core images are not built here: they need the prebuilt
# toolchain and take up to 40 min per core.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: docker version
      - run: python -m pytest -q
